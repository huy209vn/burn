[package]
name = "burn-jepa"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
# Enabling features here simplifies the build process
burn = { path = "../burn", default-features = false, features = ["train", "ndarray"] }
burn-core = { path = "../burn-core", default-features = false }
burn-derive = { path = "../burn-derive" }
burn-nn = { path = "../burn-nn", default-features = false }
burn-autodiff = { path = "../burn-autodiff", default-features = false }
burn-train = { path = "../burn-train", default-features = false }

rand = { version = "0.8.5", default-features = false }

[dev-dependencies]
burn-ndarray = { path = "../burn-ndarray", default-features = false }

[features]
default = ["std"]
std = ["burn/std", "burn-core/std", "burn-nn/std", "burn-autodiff/std", "rand/std", "rand/std_rng"]

cuda = ["burn/cuda"]
cubecl = ["burn/cubecl"]

train = []


[[test]]
name = "unit_mask"
required-features = ["std", "train"]

[[test]]
name = "integration"
required-features = ["std", "train"]
